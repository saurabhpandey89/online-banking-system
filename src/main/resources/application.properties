spring.application.name=onlinebankingsystem

# Datasource Configuration for Persistent File-based H2
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/bankdb};AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration (Secured: disabled by default in production)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# JWT Security Configuration (Externalized with environment variable override)
jwt.secret=${JWT_SECRET:onlinebankingsystem_default_secure_dev_jwt_secret_key_256bit_minimum_length!}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}