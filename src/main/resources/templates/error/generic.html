<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Apex Horizon Bank</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Design CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container text-center animate-fade-in" style="max-width: 500px;">
        <i class="fa-solid fa-triangle-exclamation text-gradient display-1 mb-4"></i>
        <h1 class="fw-bold mb-3" th:text="${status != null ? 'Error ' + status : 'Error'}">Error 404</h1>
        <h4 class="text-white mb-4" th:text="${error != null ? error : 'Something went wrong'}">Page Not Found</h4>
        <p class="text-secondary mb-5" th:text="${message != null ? message : 'The page or resource you are looking for could not be found or processed.'}">We apologize for the inconvenience.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/dashboard}" class="btn btn-primary-custom"><i class="fa-solid fa-house me-2"></i>Go to Dashboard</a>
            <a th:href="@{/}" class="btn btn-secondary-custom">Back to Home</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
